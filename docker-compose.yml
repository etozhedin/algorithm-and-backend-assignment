services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nutrition
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrition}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition -d nutrition"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nutrition:${POSTGRES_PASSWORD:-nutrition}@db:5432/nutrition
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nutrition:${POSTGRES_PASSWORD:-nutrition}@db:5432/nutrition
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - ./data:/imports:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://nutrition:${POSTGRES_PASSWORD:-nutrition}@db:5432/nutrition
    command: ["pytest", "-q"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
