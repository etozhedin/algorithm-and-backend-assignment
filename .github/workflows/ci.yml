name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutrition_test
          POSTGRES_USER: nutrition
          POSTGRES_PASSWORD: nutrition
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nutrition -d nutrition_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nutrition:nutrition@localhost:5432/nutrition_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check nutrition tests migrations
      - run: uv run --frozen ruff format --check nutrition tests migrations
      - run: uv run --frozen pytest -q
      - run: docker build --target runtime -t nutrition-api .
